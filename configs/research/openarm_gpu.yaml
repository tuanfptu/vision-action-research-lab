# Locked before new training/test evaluation. FP32; no foundation weights.
models: [bc, state, act, official_act, diffusion, flow, video]
seeds: [7, 17, 27]
training:
  model: bc
  seed: 7
  split_seed: 7
  device: cuda
  preload_device: true
  batch_size: 64
  gradient_accumulation: 1
  dim: 64
  chunk: 4
  latent: 8
  beta: 0.01
  lr: 0.001
  epochs: 12
  sampling_steps: 10
  cameras: [ceiling, wrist_right]
  image_size: 32
  history: 2
model_overrides:
  official_act: {batch_size: 32, gradient_accumulation: 2}
# One-factor validation-only ACT extensions; base ACT is reused.
ablation_overrides:
  chunk1: {chunk: 1}
  chunk8: {chunk: 8}
  latent4: {latent: 4}
  no_kl: {beta: 0.0}
  ceiling_only: {cameras: [ceiling]}
  half_data: {train_fraction: 0.5}
